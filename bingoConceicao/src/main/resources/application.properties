spring.application.name=bingoConceicao

# Configuracoes do Banco de Dados
spring.datasource.url=sua_url
spring.datasource.username=sue_nome
spring.datasource.password=sua_senha
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do Hibernate/JPAs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Desativa a formatacao bonitinha
spring.jpa.properties.hibernate.format_sql=false

# Desativa o log detalhado dos parametros
logging.level.org.hibernate.orm.queries=info
logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=info

frontend.url=${FRONTEND_URL:https://bingo.otaviano.dev.br}
backend.url=${BACKEND_URL:https://sua_url}
